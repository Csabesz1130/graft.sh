[build-system]
requires = ["setuptools>=77"]   # SPDX license expressions
build-backend = "setuptools.build_meta"

[project]
name = "graft-sh"
description = "Rebase a model's verified behavior onto a new base model."
readme = "README.md"
license = "FSL-1.1-ALv2"
license-files = ["LICENSE", "NOTICE", "TRADEMARKS.md"]
authors = [{ name = "Balogh Csaba" }]
requires-python = ">=3.11"
dynamic = ["version"]
dependencies = []          # the core is standard library only

[project.optional-dependencies]
sign = ["cryptography>=42"]
train = ["torch>=2.2", "transformers>=4.45", "peft>=0.12", "accelerate>=0.30"]

[project.scripts]
graft = "graft.cli:main"

[project.urls]
Repository = "https://github.com/csabesz1130/graft.sh"

[tool.setuptools]
packages = ["graft"]

[tool.setuptools.dynamic]
version = { attr = "graft.__version__" }
