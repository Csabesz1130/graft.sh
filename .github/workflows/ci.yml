name: ci
on:
  push:
    branches: [main, dev, v0.2]
  pull_request:
    branches: [main, dev, v0.2]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    name: Baseline acceptance (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Run the installed CLI, unit and demo tests
        env:
          GRAFT_TEST_PYTHON: python
        run: scripts/server-test.sh

  macos:
    name: macOS on Apple Silicon (install, unit tests, demo)
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Time local HTTP on macOS (temporary)
        timeout-minutes: 5
        run: |
          python -m pip install -q -e .
          python - <<'PY'
          import socket, sys, threading, time, urllib.request, json
          t = time.time(); socket.getfqdn("127.0.0.1"); print(f"getfqdn(127.0.0.1) {time.time()-t:.2f}s")
          t = time.time(); socket.gethostname(); print(f"gethostname {time.time()-t:.2f}s")
          t = time.time(); urllib.request.getproxies(); print(f"getproxies {time.time()-t:.2f}s")
          sys.path.insert(0, "examples/support-desk")
          from mock_models import serve
          t = time.time(); server = serve(8999); print(f"mock serve() {time.time()-t:.2f}s")
          threading.Thread(target=server.serve_forever, daemon=True).start()
          for i in range(3):
              t = time.time(); urllib.request.urlopen("http://127.0.0.1:8999/v1/models", timeout=30).read()
              print(f"GET /models {time.time()-t:.2f}s")
          body = json.dumps({"model": "acme/support-v3", "messages": [{"role": "user", "content": "hi"}]}).encode()
          for i in range(3):
              t = time.time()
              urllib.request.urlopen(urllib.request.Request("http://127.0.0.1:8999/v1/chat/completions", body,
                                     {"Content-Type": "application/json"}), timeout=30).read()
              print(f"POST chat {time.time()-t:.2f}s")
          from graft import runners
          r = runners.build("m", {"endpoint": "http://127.0.0.1:8999/v1", "model": "acme/support-v3"}, __import__("pathlib").Path("."))
          for i in range(3):
              t = time.time(); r.complete([{"role": "user", "content": "hi"}]); print(f"graft runner {time.time()-t:.2f}s")
          t = time.time(); import subprocess; subprocess.run([sys.executable, "-c", "import graft.cli"]); print(f"python -c import graft.cli {time.time()-t:.2f}s")
          PY
      - name: Run the installed CLI, unit and demo tests
        env:
          GRAFT_TEST_PYTHON: python
        run: scripts/server-test.sh

  train-cpu:
    name: CPU trainer and full rebase
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run all trainer tests on CPU
        env:
          CUDA_VISIBLE_DEVICES: ""
          GRAFT_TEST_PYTHON: python
          GRAFT_TORCH_INDEX_URL: https://download.pytorch.org/whl/cpu
          OMP_NUM_THREADS: "2"
          MKL_NUM_THREADS: "2"
        run: scripts/server-test.sh --train

  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uvx ruff@0.17.0 check graft tests examples scripts
      - run: shellcheck -S warning install.sh scripts/server-test.sh
