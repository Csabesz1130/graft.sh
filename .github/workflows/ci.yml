name: ci
on:
  push:
    branches: [main, dev, "v*"]
  pull_request:
    branches: [main, dev, "v*"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    name: Baseline acceptance (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Run the installed CLI, unit and demo tests
        env:
          GRAFT_TEST_PYTHON: python
        run: scripts/server-test.sh

  macos:
    name: macOS on Apple Silicon (install, unit tests, demo)
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run the installed CLI, unit and demo tests
        env:
          GRAFT_TEST_PYTHON: python
        run: scripts/server-test.sh

  train-cpu:
    name: CPU trainer and full rebase
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run all trainer tests on CPU
        env:
          CUDA_VISIBLE_DEVICES: ""
          GRAFT_TEST_PYTHON: python
          GRAFT_TORCH_INDEX_URL: https://download.pytorch.org/whl/cpu
          OMP_NUM_THREADS: "2"
          MKL_NUM_THREADS: "2"
        run: scripts/server-test.sh --train

  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uvx ruff@0.17.0 check graft tests examples scripts
      - run: shellcheck -S warning install.sh scripts/server-test.sh
