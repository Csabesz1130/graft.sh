# Asks each outside contributor to sign CLA.md once, by commenting on their pull request.
# Signatures are stored on the cla-signatures branch of this repository. The workflow never checks out or runs
# pull request code, which is what makes pull_request_target safe here.
name: CLA
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, synchronize, reopened, closed]

permissions:
  actions: write
  contents: write        # store signatures on the cla-signatures branch
  pull-requests: write   # comment on and label the pull request
  statuses: write

jobs:
  cla:
    if: >-
      (github.event_name == 'pull_request_target') ||
      (github.event.issue.pull_request &&
       (github.event.comment.body == 'recheck' ||
        github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'))
    runs-on: ubuntu-latest
    steps:
      - uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08  # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/cla.json
          path-to-document: https://github.com/Csabesz1130/graft.sh/blob/main/CLA.md
          branch: cla-signatures
          allowlist: Csabesz1130,dependabot[bot],github-actions[bot]
