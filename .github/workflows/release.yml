# Builds the wheel and sdist for a tag, lists their sha256 in SHA256SUMS, and attests all three with GitHub's
# Sigstore-backed build provenance, so anyone can check a download came from this repository's workflow:
#   sha256sum -c SHA256SUMS
#   gh attestation verify graft_sh-<version>-py3-none-any.whl -R Csabesz1130/graft.sh
# A tag push attaches the files to its GitHub release; a manual run only builds and attests them.
name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write       # attach files to the release
  id-token: write       # Sigstore signing for the attestation
  attestations: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: |
          python -m pip install -q build
          python -m build --outdir dist
          cd dist && sha256sum -- * > SHA256SUMS && cat SHA256SUMS
      - name: Check the version matches the tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version="$(python -c 'import graft; print(graft.__version__)')"
          [ "v${version}" = "${GITHUB_REF_NAME}" ] || { echo "graft.__version__ is ${version}, tag is ${GITHUB_REF_NAME}"; exit 1; }
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: "dist/*"
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 || gh release create "${GITHUB_REF_NAME}" --verify-tag --title "${GITHUB_REF_NAME}" --notes "See CHANGELOG.md."
          gh release upload "${GITHUB_REF_NAME}" dist/* --clobber
