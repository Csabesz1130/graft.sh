statement = "Timestamps are UTC text 'YYYY-MM-DD HH:MM:SS', and a date range is half-open: created_at >= the first day AND created_at < the day after the last day, never BETWEEN. Work out \"last month\", \"this year\" or \"the last 7 days\" from the today given in the system message and write the dates as literals, never date('now'); \"the last N days\" are the N full days before today, without today."
